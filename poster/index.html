<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />

  <title>Minechat · 面向 Minecraft 内容创作者的协作工具</title>
  <meta name="description" content="Minechat：面向 Minecraft 内容创作者的协作工具。文件共享、信息查询、信息更新与聊天交互，覆盖 Windows / macOS / Android / iOS。" />

  <link rel="icon" href="../favicon.ico" />

  <style>
    :root{
      --bg: #ffffff;
      --bg-soft: #f4f8ff;
      --panel: #ffffff;
      --text: #101828;
      --muted: #667085;
      --border: rgba(16,24,40,.10);
      --accent: #2f7cff;
      --accent-deep: #1f6bff;
      --accent-soft: rgba(47,124,255,.10);
      --shadow-lg: 0 32px 90px rgba(48,86,160,.32), 0 10px 28px rgba(48,86,160,.18);
      --shadow-md: 0 16px 44px rgba(48,86,160,.16);
      --shadow-sm: 0 6px 18px rgba(48,86,160,.10);
      --radius: 22px;

      --max: 1200px;
      --pad: 32px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color:var(--text);
      background:
        radial-gradient(720px 480px at 12% 18%, var(--accent-soft), transparent 62%),
        radial-gradient(640px 460px at 88% 82%, rgba(22,163,74,.08), transparent 60%),
        linear-gradient(180deg, var(--bg-soft), var(--bg) 42%);
      line-height:1.6;
      font-size: 16px;
      min-height:100%;
    }

    a{ color:inherit; text-decoration:none; }

    .container{ max-width:var(--max); margin:0 auto; padding:0 var(--pad); }

    /* ---------- header ---------- */
    header{ padding: 20px 0; }
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand{ display:inline-flex; align-items:center; gap:12px; margin-bottom: 20px; }
    .brand img{ width:46px; height:46px; border-radius:13px; box-shadow:var(--shadow-sm); display:block; }
    .brand strong{ font-size:22px; letter-spacing:.2px; }
    .nav{ display:flex; align-items:center; gap:10px; }
    .nav a{
      font-size:14px; color:var(--muted);
      padding:8px 14px; border-radius:999px; border:1px solid transparent;
      transition: all .18s ease;
    }
    .nav a:hover{ color:var(--text); border-color:var(--border); background:var(--panel); }
    .nav a.primary{
      color:#fff; background:var(--accent-deep); border-color:transparent;
      box-shadow: 0 8px 20px rgba(47,124,255,.32);
    }
    .nav a.primary:hover{ filter:brightness(1.06); color:#fff; }

    /* ---------- hero layout ---------- */
    .hero{
      display:grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 56px;
      align-items:center;
      padding: 28px 0 72px;
      min-height: calc(100vh - 92px);
    }

    /* ---------- left: device collage (5 screenshots, overlapping) ---------- */
    .stage{
      position:relative;
      width:100%;
      max-width: 720px;
      margin: 0 auto;
      aspect-ratio: 1 / .8;
      transform: perspective(1150px) rotateY(21deg);
      transform-origin: center;
    }

    .device-desktop{
      position:absolute;
      border-radius:14px;
      overflow:hidden;
      border:1px solid var(--border);
      box-shadow: var(--shadow-lg);
    }
    .screen{
      width:100%; aspect-ratio: 3 / 2; display:block;
      object-fit:cover; object-position:top center;
      background:var(--bg-soft);
    }

    .device-phone{
      position:absolute;
      border-radius: 14px;
      overflow:hidden;
      box-shadow: var(--shadow-lg);
    }
    .device-phone img{
      width:100%; aspect-ratio: 1179 / 2556; display:block;
      object-fit:cover; object-position:top center;
      background:var(--bg-soft);
    }

    /* collage placement: desktop windows behind, phones overlapping on top */
    .d1{ left:0;   top:3%;  width:64%; z-index:1; animation: floaty 9s ease-in-out infinite; }
    .d2{ left:45%; top:9%;  width:53%; z-index:2; animation: floaty 8s ease-in-out .8s infinite; }
    .p1{ left:8%;  top:26%; width:19%; z-index:3; animation: floaty 7s ease-in-out 1.4s infinite; }
    .p2{ left:30%; top:26%; width:19%; z-index:4; animation: floaty 7.5s ease-in-out .5s infinite; }
    .p3{ left:52%; top:26%; width:19%; z-index:3; animation: floaty 6.8s ease-in-out 2s infinite; }

    @keyframes floaty{
      0%,100%{ translate: 0 0; }
      50%{ translate: 0 -9px; }
    }

    /* ---------- right: copy ---------- */
    .copy{ max-width: 480px; }

    h1{
      margin:0 0 18px;
      font-size: clamp(30px, 3.4vw, 44px);
      line-height:1.22;
      letter-spacing:-.01em;
      font-weight:800;
    }
    h1 .hl{ color:var(--accent); }

    .lead{
      margin:0 0 26px;
      color:var(--muted);
      font-size: 15px;
      max-width: 26rem;
    }
    .lead a{ text-decoration:underline; text-underline-offset:3px; }
    .lead a:hover{ color:var(--text); }

    .bullets{
      list-style:none; margin:0; padding:0;
      display:flex; flex-wrap:wrap; gap: 12px 28px;
    }
    .bullets li{
      display:flex; align-items:center; gap:9px;
      font-size:14.5px; font-weight:600;
    }
    .bullets svg{ width:19px; height:19px; color:var(--accent); flex:none; }

    /* ---------- footer ---------- */
    footer{
      border-top:1px solid var(--border);
      padding: 22px 0 40px;
      color:var(--muted);
      font-size:13px;
    }
    .footer-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    footer a{ text-decoration:underline; text-underline-offset:3px; }
    footer a:hover{ color:var(--text); }

    /* ---------- responsive ---------- */
    @media (max-width: 960px){
      .hero{
        grid-template-columns: 1fr;
        gap: 40px;
        min-height: unset;
        padding-top: 12px;
      }
      .copy{ max-width:none; order:-1; }
    }
    @media (max-width: 480px){
      .device-phone{ border-radius: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="topbar">
        <span></span>
        <nav class="nav" aria-label="主导航">
          <a href="https://github.com/AgathaNetwork" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a class="primary" href="../download.html">立即下载</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="hero">

      <!-- 左侧：软件主界面展示（五张截图叠加） -->
      <section class="stage" aria-label="软件界面展示">
        <div class="device-desktop d1">
          <img class="screen" src="0c8afb6c36bd27838ef6554eb2534aed.png" alt="Minechat 桌面端图文界面" />
        </div>
        <div class="device-desktop d2">
          <img class="screen" src="30736178ee34c149181165959e436035.png" alt="Minechat 桌面端会话界面" />
        </div>
        <div class="device-phone p1">
          <img src="a615cf9a58a2f7571b84e2e3e8996d8c.png" alt="Minechat 移动端全服聊天界面" />
        </div>
        <div class="device-phone p2">
          <img src="67c9917184ed1948395198faaa2250de.png" alt="Minechat 移动端图文界面" />
        </div>
        <div class="device-phone p3">
          <img src="54bd6afe1ae107348c69137b1c7e8450.png" alt="Minechat 移动端工作台界面" />
        </div>
      </section>

      <!-- 右侧：标题与介绍 -->
      <section class="copy">
        <a class="brand" href="index.html" aria-label="Minechat 首页">
          <img src="../logo.png" alt="Minechat 图标" />
          <strong>Minechat</strong>
        </a>

        <h1>面向 Minecraft<br />内容创作者的<span class="hl">协作工具</span></h1>

        <p class="lead">
          <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备2026018443号-2</a>
        </p>

        <ul class="bullets">
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="14" height="10" rx="2"/><path d="M6 18h6"/><path d="M9 14v4"/><rect x="17" y="9" width="5" height="9" rx="1.5"/></svg>
            全平台覆盖
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
            消息实时触达
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg>
            素材一站管理
          </li>
        </ul>
      </section>

    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-row">
        <div>MatrixEcho（深圳回响矩阵人工智能有限公司） · Minechat 协作软件</div>
        <div>
          ICP 备案号：
          <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备2026018443号-2</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
